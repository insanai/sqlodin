name: Binary release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-amd64
          - runner: macos-14
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release version
        run: python3 tools/check_release_version.py
      - uses: ./.github/actions/native-setup
      - name: Build self-contained executable
        run: python3 tools/build_cli.py --output bin/sqlodin --jobs 4
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: |
          odin test tests -debug -thread-count:4 -define:ODIN_TEST_THREADS=4 -out:build/release-tests -define:ODIN_TEST_JSON_REPORT=build/release-tests.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/release-tests.json').read_text())
          assert report['total'] > 0 and report['success'] == report['total'], report
          PY
          python3 tools/test_compare_three_hosts.py
          python3 -m pip install './languages/python[test]'
          python3 -m pytest languages/python/tests
          ./bin/sqlodin local build/release-smoke.db 'CREATE TABLE t (id INTEGER PRIMARY KEY); INSERT INTO t VALUES (1); SELECT * FROM t;'
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp README.md bin/
          tar -czf "dist/sqlodin-$TARGET.tar.gz" -C bin sqlodin sqlodin.build.json licenses README.md
          if [ -f build/release-tests.json ]; then cp build/release-tests.json dist/linux-tests.json; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlodin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sqlodin-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz linux-tests.json > SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "This release is already published; do not replace its assets"'
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "SQLodin $RELEASE_TAG" --notes-file ../.github/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.tar.gz linux-tests.json SHA256SUMS
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
