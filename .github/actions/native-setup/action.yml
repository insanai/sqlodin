name: Native toolchain
description: Install pinned Odin and restore verified native dependency archives
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build/native
          build/downloads
        key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/native_sources.json', 'tools/build_native.py', 'tools/build_shell.py', 'internal/shell/**') }}
    - name: Install pinned Odin
      shell: bash
      run: |
        python3 tools/install_release_odin.py > build-odin.log
        cat build-odin.log
        tail -n 1 build-odin.log >> "$GITHUB_PATH"
